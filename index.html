<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <title>తహసీల్దార్ వారి కార్యాలయం - పెద్దవడుగూరు మండలం</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <!-- Main Header -->
  <header class="bg-gradient-to-r from-teal-900 via-emerald-800 to-cyan-900 text-white shadow-xl sticky top-0 z-40 border-b border-emerald-500/20">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
      <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-3.5">
        <div class="bg-white/10 p-2.5 rounded-2xl backdrop-blur-md shadow-inner border border-white/20">
          <i data-lucide="landmark" class="w-7 h-7 text-amber-300"></i>
        </div>
        <div>
          <div class="flex items-center justify-center sm:justify-start gap-2 flex-wrap">
            <h1 class="text-lg sm:text-xl md:text-2xl font-black tracking-tight drop-shadow-sm">తహసీల్దార్ వారి కార్యాలయం</h1>
            <span class="bg-amber-400/20 text-amber-300 border border-amber-300/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">లైవ్ డెస్క్</span>
          </div>
          <p class="text-xs sm:text-sm text-teal-100 font-medium">పెద్దవడుగూరు మండలం • రెవెన్యూ విభాగం</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-2.5 w-full sm:w-auto">
        <div class="inline-flex items-center gap-2 bg-emerald-950/60 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-emerald-200 border border-emerald-400/30 shadow-sm">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
          లైవ్ స్టేటస్
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-6 sm:py-8 space-y-6 sm:space-y-8">

    <!-- Order Issue Form -->
    <div class="glass-card rounded-3xl shadow-lg border border-slate-200/90 overflow-hidden relative">
      
      <div class="border-b border-slate-100 bg-slate-50/90 px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div class="flex items-center space-x-2.5">
          <div class="p-2 bg-teal-100 text-teal-800 rounded-xl">
            <i data-lucide="send" class="w-5 h-5 text-teal-700"></i>
          </div>
          <div>
            <h2 class="text-sm sm:text-base font-extrabold text-slate-800">సిబ్బందికి ఆదేశాల జారీ & విచారణ కేటాయింపు</h2>
            <p class="text-[11px] sm:text-xs text-slate-500">అర్జీని నమోదు చేసి సిబ్బందికి కేటాయించడం</p>
          </div>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
          <span class="text-[11px] font-semibold text-teal-700 bg-teal-50 px-3 py-1.5 rounded-full border border-teal-200 flex items-center gap-1.5">
            <i data-lucide="check-check" class="w-3.5 h-3.5"></i> ఆన్‌లైన్ నోటీస్ సదుపాయం
          </span>
        </div>
      </div>

      <form id="dispatchForm" class="p-4 sm:p-6 md:p-8 space-y-6">
        <fieldset id="formFieldSet" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">

            <!-- Revenue Category -->
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">అర్జీ రకం (Revenue Category)</label>
              <div class="relative">
                <select id="appType" required onchange="updateSubCategories()" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition appearance-none font-medium shadow-sm">
                  <option value="">ఎంచుకోండి</option>
                  <option value="ROR">ROR</option>
                  <option value="PGRS">PGRS అర్జీ</option>
                  <option value="Survey">Survey</option>
                  <option value="మండలo అప్లికేషన్">మండలo అప్లికేషన్</option>
                  <option value="APSEVA కొరకు">APSEVA కొరకు</option>
                  <option value="ఎన్నికలు (Elections)">ఎన్నికలు (Elections)</option>
                  <option value="పౌర సరఫరాలు (Civil Supplies)">పౌర సరఫరాలు (Civil Supplies)</option>
                  <option value="ఇతరములు">ఇతరములు</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3.5 top-4 pointer-events-none"></i>
              </div>
            </div>

            <!-- Sub Category (Dynamic) -->
            <div id="subCategoryContainer" class="hidden">
              <label class="block text-xs font-bold text-teal-800 uppercase tracking-wider mb-2">సబ్-కేటగిరీ (Sub Category)</label>
              <div class="relative">
                <select id="subCategory" class="w-full bg-teal-50/50 border border-teal-300 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition appearance-none font-semibold shadow-sm">
                  <option value="">సబ్-కేటగిరీ ఎంచుకోండి</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-teal-600 absolute right-3.5 top-4 pointer-events-none"></i>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">అర్జిదారుని పేరు (Applicant Name)</label>
              <div class="relative">
                <input type="text" id="applicantName" placeholder="ఉదా: రామాంజనేయులు" required class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition font-medium shadow-sm">
                <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute right-3.5 top-3.5"></i>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">రిఫరెన్స్ / అర్జీ నంబర్</label>
              <div class="relative">
                <input type="text" id="refNo" placeholder="F-8/2026/నోటీస్-12" required class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition font-medium shadow-sm">
                <i data-lucide="hash" class="w-4 h-4 text-slate-400 absolute right-3.5 top-3.5"></i>
              </div>
            </div>

            <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">సిబ్బంది పేరు (Staff / VRO)</label>
                <input type="text" id="staffName" placeholder="సిబ్బంది పేరు నమోదు చేయండి" required class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition font-medium shadow-sm">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">WhatsApp ఫోన్ నంబర్</label>
                <div class="relative flex shadow-sm rounded-2xl overflow-hidden">
                  <span class="inline-flex items-center px-3 sm:px-4 border border-r-0 border-slate-300 bg-slate-100 text-slate-700 text-xs sm:text-sm font-bold">
                    🇮🇳 +91
                  </span>
                  <input type="tel" id="staffPhone" pattern="[0-9]{10}" maxlength="10" placeholder="9876543210" required class="w-full bg-slate-50 border border-slate-300 rounded-r-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition font-medium">
                </div>
              </div>
            </div>

            <!-- File Upload -->
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">అర్జీ కాపీ (PDF / JPG)</label>
              <div class="relative">
                <input type="file" id="fileUpload" accept="application/pdf,image/jpeg,image/png" class="w-full text-xs text-slate-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-teal-50 file:text-teal-800 hover:file:bg-teal-100 border border-slate-300 rounded-2xl p-1.5 bg-slate-50 shadow-sm cursor-pointer relative z-10">
              </div>
            </div>

            <div class="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4 bg-gradient-to-r from-teal-50/80 via-emerald-50/80 to-teal-50/80 p-4 sm:p-5 rounded-2xl border border-teal-200">
              <div>
                <label class="block text-xs font-bold text-teal-950 uppercase tracking-wider mb-2">గడువు రోజులు</label>
                <select id="presetDays" class="w-full bg-white border border-teal-300 rounded-xl px-4 py-2.5 text-sm outline-none font-semibold">
                  <option value="3" selected>3 రోజులు</option>
                  <option value="5">5 రోజులు</option>
                  <option value="7">7 రోజులు</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-teal-950 uppercase tracking-wider mb-2">గడువు తేదీ & సమయం</label>
                <input type="datetime-local" id="dueDate" required class="w-full bg-white border border-teal-300 rounded-xl px-4 py-2.5 text-sm text-teal-950 font-black outline-none">
              </div>
            </div>

          </div>

          <div class="flex justify-end pt-4 border-t border-slate-100">
            <button type="submit" id="submitBtn" class="w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white text-xs sm:text-sm font-bold px-6 py-3.5 rounded-2xl shadow-lg transition cursor-pointer">
              <i data-lucide="send" class="w-4 h-4"></i> ఆదేశం జారీ చేసి WhatsApp కి పంపు
            </button>
          </div>
        </fieldset>
      </form>
    </div>

  </main>

  <script>
    lucide.createIcons();

    function updateSubCategories() {
      const appType = document.getElementById('appType').value;
      const subContainer = document.getElementById('subCategoryContainer');
      if(appType) {
        subContainer.classList.remove('hidden');
      } else {
        subContainer.classList.add('hidden');
      }
    }

    // ఫామ్ సబ్మిట్ చేసి WhatsApp కి పంపే కోడ్
    document.getElementById('dispatchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const appType = document.getElementById('appType').value;
      const applicantName = document.getElementById('applicantName').value;
      const staffPhone = document.getElementById('staffPhone').value;
      const staffName = document.getElementById('staffName').value;
      const refNo = document.getElementById('refNo').value;

      const message = `నమస్కారం ${staffName} గారు,%0A%0Aపెద్దవడుగూరు తహసీల్దార్ కార్యాలయం నుండి మీకు కొత్త అర్జీ కేటాయించబడింది.%0A%0A📌 అర్జీ రకం: ${appType}%0A🔢 రిఫరెన్స్ నం: ${refNo}%0A👤 అర్జిదారుడు: ${applicantName}%0A%0Aదయ పరిశీలించి తగు చర్యలు తీసుకోవాల్సిందిగా కోరడమైనది.`;
      
      const whatsappUrl = `https://wa.me/91${staffPhone}?text=${message}`;
      window.open(whatsappUrl, '_blank');
    });
  </script>
</body>
</html>
